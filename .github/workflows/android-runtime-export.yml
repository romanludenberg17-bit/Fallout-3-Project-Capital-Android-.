name: Android runtime export

on:
  workflow_dispatch:
  push:
    branches:
      - 'engine/**'
    paths:
      - '.github/workflows/android-runtime-export.yml'
      - 'docs/**'

jobs:
  export-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Project Capital
        uses: actions/checkout@v4

      - name: Checkout Android runtime candidate
        uses: actions/checkout@v4
        with:
          repository: openconstruct/OpenNevada-Android
          ref: d22b6c5ae5f83254e25ee9e311661299eb50da73
          path: runtime-candidate

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.311'

      - name: Bootstrap Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" platform-tools 'platforms;android-36' 'build-tools;36.0.0'

      - name: Download Godot 4.7.2 Mono
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot/editor"
          BASE='https://github.com/godotengine/godot/releases/download/4.7.2-stable'
          curl -L --fail --retry 5 --retry-all-errors -o "$RUNNER_TEMP/godot/editor.zip" "$BASE/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot/editor"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/editor" -type f -name 'Godot_*_mono_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          mkdir -p "$TEMPLATE_DIR"
          curl -L --fail --retry 5 --retry-all-errors -o "$RUNNER_TEMP/godot/templates.tpz" "$BASE/Godot_v4.7.2-stable_mono_export_templates.tpz"
          unzip -q -j "$RUNNER_TEMP/godot/templates.tpz" 'templates/*' -d "$TEMPLATE_DIR"
          test -s "$TEMPLATE_DIR/android_debug.apk"

      - name: Build C# runtime
        working-directory: runtime-candidate
        run: |
          set -euo pipefail
          dotnet restore runtime/OpenNV.csproj
          dotnet build runtime/OpenNV.csproj --configuration Release --no-restore
          test -s runtime/.godot/mono/temp/bin/Release/OpenNV.dll

      - name: Install Android Gradle template
        working-directory: runtime-candidate
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 5m "$GODOT_BIN" --headless --path runtime --install-android-build-template
          test -f runtime/android/build.gradle
          test -f runtime/android/build/src/com/godot/game/GodotApp.java

      - name: Prepare Project Capital Android preset
        working-directory: runtime-candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('runtime/export_presets.cfg')
          text = p.read_text()
          text = text.replace('gradle_build/use_gradle_build=false', 'gradle_build/use_gradle_build=true', 1)
          text = text.replace('package/unique_name="io.github.openconstruct.opennevada"', 'package/unique_name="io.github.romanludenberg17.projectcapital"', 1)
          text = text.replace('package/name="OpenNevada Experimental"', 'package/name="Project Capital Experimental"', 1)
          p.write_text(text)
          project = Path('runtime/project.godot')
          project.write_text(project.read_text().replace('config/name="OpenNV"', 'config/name="Project Capital"', 1))
          PY
          grep -Fq 'gradle_build/use_gradle_build=true' runtime/export_presets.cfg
          grep -Fq 'io.github.romanludenberg17.projectcapital' runtime/export_presets.cfg

      - name: Build Android C# project
        working-directory: runtime-candidate
        run: |
          set -euo pipefail
          dotnet restore runtime/OpenNV.csproj -p:GodotTargetPlatform=android
          dotnet build runtime/OpenNV.csproj --configuration Release --no-restore -p:GodotTargetPlatform=android

      - name: Export Android ARM64 APK
        working-directory: runtime-candidate
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/Project-Capital-Android-arm64.apk"
          "$GODOT_BIN" --headless --path runtime --export-debug 'Android Handheld Experimental' "$APK"
          test -s "$APK"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/Project-Capital-Android-arm64.apk"
          APK_ANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          test -n "$APK_ANALYZER"
          APP_ID="$("$APK_ANALYZER" manifest application-id "$APK")"
          test "$APP_ID" = 'io.github.romanludenberg17.projectcapital'
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libgodot_android.so$'
          unzip -Z1 "$APK" | grep -q 'classes.dex$'

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: project-capital-android-arm64
          path: ${{ runner.temp }}/Project-Capital-Android-arm64.apk
          if-no-files-found: error
          retention-days: 7
