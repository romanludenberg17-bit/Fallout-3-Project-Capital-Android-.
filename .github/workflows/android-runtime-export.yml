name: Android runtime export

on:
  workflow_dispatch:
  push:
    branches:
      - 'engine/**'
    paths:
      - '.github/workflows/android-runtime-export.yml'
      - 'docs/**'

jobs:
  export-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project Capital
        uses: actions/checkout@v4

      - name: Checkout Android runtime candidate
        uses: actions/checkout@v4
        with:
          repository: openconstruct/OpenNevada-Android
          ref: d22b6c5ae5f83254e25ee9e311661299eb50da73
          path: runtime-candidate

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.311'

      - name: Bootstrap Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Godot 4.7.2 Mono
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          BASE="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          curl -L --fail --retry 5 --retry-all-errors -o "$RUNNER_TEMP/godot/editor.zip" "$BASE/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          unzip -tq "$RUNNER_TEMP/godot/editor.zip"
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot/editor"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/editor" -type f -name 'Godot_*_mono_linux.*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          mkdir -p "$TEMPLATE_DIR"
          curl -L --fail --retry 5 --retry-all-errors -o "$RUNNER_TEMP/godot/templates.tpz" "$BASE/Godot_v4.7.2-stable_mono_export_templates.tpz"
          unzip -tq "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q -j "$RUNNER_TEMP/godot/templates.tpz" 'templates/*' -d "$TEMPLATE_DIR"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Install Android Gradle template
        working-directory: runtime-candidate
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path runtime --install-android-build-template
          test -f runtime/android/build.gradle
          test -f runtime/android/build/src/com/godot/game/GodotApp.java

      - name: Add Fallout 3 Android bridge
        working-directory: runtime-candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          presets = Path('runtime/export_presets.cfg')
          text = presets.read_text()
          text = text.replace('gradle_build/use_gradle_build=false', 'gradle_build/use_gradle_build=true', 1)
          text = text.replace('package/unique_name="io.github.openconstruct.opennevada"', 'package/unique_name="io.github.romanludenberg17.projectcapital"', 1)
          text = text.replace('package/name="OpenNevada Experimental"', 'package/name="Project Capital Experimental"', 1)
          text = text.replace('command_line/extra_args="-- --launcher --auto-launch', 'command_line/extra_args="-- --launcher --auto-launch', 1)
          presets.write_text(text)

          project = Path('runtime/project.godot')
          project.write_text(project.read_text().replace('config/name="OpenNV"', 'config/name="Project Capital"', 1))

          store = Path('runtime/src/Presentation/Ui/GodotLauncherProfileStore.cs')
          text = store.read_text()
          text = text.replace('''        store.ImportLegacyRegistrations();\n        return store;''', '''        store.ImportLegacyRegistrations();\n        store.ImportAndroidOwnedFallout3Folder();\n        return store;''', 1)
          marker = '    private bool ImportDataRegistration(string legacyRoot, string campaignId, string fileName)\n'
          method = '''    private void ImportAndroidOwnedFallout3Folder()\n    {\n        if (!OperatingSystem.IsAndroid() || _profiles.ContainsKey("fallout3")) return;\n        var marker = ProjectSettings.GlobalizePath("user://fallout3-install-path.txt");\n        try\n        {\n            if (!File.Exists(marker)) return;\n            var root = File.ReadAllText(marker).Trim();\n            if (string.IsNullOrWhiteSpace(root)) return;\n            var installation = NativeGameInstallation.Detect(root);\n            if (installation.Game != NativeGame.Fallout3) return;\n            _profiles["fallout3"] = new GodotLauncherProfile("fallout3", installation.InstallRoot, SavePath("fallout3"));\n            _lastCampaignId = "fallout3";\n            Persist();\n            GD.Print($"OPENNV_ANDROID_FO3_PROFILE path={installation.InstallRoot}");\n        }\n        catch (Exception e) when (e is DirectoryNotFoundException or InvalidDataException or IOException or UnauthorizedAccessException)\n        {\n            GD.Print($"OPENNV_ANDROID_FO3_PROFILE unavailable reason={e.Message}");\n        }\n    }\n\n'''
          if marker not in text: raise SystemExit('profile insertion marker not found')
          text = text.replace(marker, method + marker, 1)
          store.write_text(text)

          activity = Path('runtime/android/build/src/com/godot/game/GodotApp.java')
          encoded = ''''''
          activity.write_bytes(base64.b64decode(encoded))
          PY
          grep -Fq 'gradle_build/use_gradle_build=true' runtime/export_presets.cfg
          grep -Fq 'REQUEST_GAME_TREE' runtime/android/build/src/com/godot/game/GodotApp.java
          grep -Fq 'ImportAndroidOwnedFallout3Folder' runtime/src/Presentation/Ui/GodotLauncherProfileStore.cs

      - name: Restore and build Android C# project
        working-directory: runtime-candidate
        run: |
          set -euo pipefail
          dotnet restore runtime/OpenNV.csproj -p:GodotTargetPlatform=android
          dotnet build runtime/OpenNV.csproj --configuration Release --no-restore -p:GodotTargetPlatform=android

      - name: Export Android ARM64 APK
        working-directory: runtime-candidate
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path runtime --export-debug "Android Handheld Experimental" "$RUNNER_TEMP/Project-Capital-Android-arm64.apk"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/Project-Capital-Android-arm64.apk"
          test -s "$APK"
          APK_ANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          APP_ID="$("$APK_ANALYZER" manifest application-id "$APK")"
          test "$APP_ID" = "io.github.romanludenberg17.projectcapital"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libgodot_android.so$'
          unzip -Z1 "$APK" | grep -q 'classes.dex$'

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: project-capital-android-arm64
          path: ${{ runner.temp }}/Project-Capital-Android-arm64.apk
          if-no-files-found: error
          retention-days: 7
