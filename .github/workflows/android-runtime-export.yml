name: Android runtime export

on:
  workflow_dispatch:
  push:
    branches:
      - 'engine/**'
    paths:
      - '.github/workflows/android-runtime-export.yml'
      - 'docs/**'

jobs:
  export-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project Capital
        uses: actions/checkout@v4

      - name: Checkout Android runtime candidate
        uses: actions/checkout@v4
        with:
          repository: openconstruct/OpenNevada-Android
          ref: d22b6c5ae5f83254e25ee9e311661299eb50da73
          path: runtime-candidate

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.311'

      - name: Bootstrap Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Godot Mono editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          GODOT_RELEASE="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          curl -L --fail --retry 5 --retry-all-errors -o "$RUNNER_TEMP/godot/godot.zip" "$GODOT_RELEASE/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          unzip -tq "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/editor"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/editor" -type f -name "Godot_*_mono_linux.*" -print -quit)"
          if [ -z "$GODOT_BIN" ]; then find "$RUNNER_TEMP/godot/editor" -maxdepth 2 -type f -printf "%p\n"; exit 1; fi
          chmod +x "$GODOT_BIN"
          test -x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          curl -L --fail --retry 5 --retry-all-errors -o "$RUNNER_TEMP/godot/templates.tpz" "$GODOT_RELEASE/Godot_v4.7.2-stable_mono_export_templates.tpz"
          unzip -tq "$RUNNER_TEMP/godot/templates.tpz"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q -j "$RUNNER_TEMP/godot/templates.tpz" 'templates/*' -d "$TEMPLATE_DIR"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          echo "Installed Android export templates:"
          ls -lh "$TEMPLATE_DIR"/android_*.apk

      - name: Prepare Android owned-install bridge
        working-directory: runtime-candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          presets = Path("runtime/export_presets.cfg")
          text = presets.read_text()
          text = text.replace(
              'command_line/extra_args="-- --launcher --auto-launch --skip-cutscenes --fixed-exposure --no-image-blur --no-double-vision --no-bloom --compact-quest-notices --render-scale-3d 0.5 --view-distance-meters 200 --performance-log --fps-overlay --verify-dds-cubemap"',
              'command_line/extra_args="-- --launcher --auto-launch --skip-cutscenes --fixed-exposure --no-image-blur --no-double-vision --no-bloom --compact-quest-notices --render-scale-3d 0.5 --view-distance-meters 200 --performance-log --fps-overlay --verify-dds-cubemap"\npermissions/manage_external_storage=true\npermissions/read_external_storage=true\npermissions/write_external_storage=true',
              1,
          )
          presets.write_text(text)

          store = Path("runtime/src/Presentation/Ui/GodotLauncherProfileStore.cs")
          text = store.read_text()
          old = '''    internal static GodotLauncherProfileStore Load()\n    {\n        var path = ProjectSettings.GlobalizePath("user://launcher/profiles-v1.json");\n        var store = Open(path, ProjectSettings.GlobalizePath("user://profiles"));\n        store.ImportLegacyRegistrations();\n        return store;\n    }'''
          new = '''    internal static GodotLauncherProfileStore Load()\n    {\n        var path = ProjectSettings.GlobalizePath("user://launcher/profiles-v1.json");\n        var store = Open(path, ProjectSettings.GlobalizePath("user://profiles"));\n        store.ImportLegacyRegistrations();\n        store.ImportAndroidOwnedFallout3Folder();\n        return store;\n    }'''
          if old not in text:
              raise SystemExit("GodotLauncherProfileStore.Load block not found")
          text = text.replace(old, new, 1)

          marker = '''    private bool ImportDataRegistration(string legacyRoot, string campaignId, string fileName)\n'''
          method = '''    private void ImportAndroidOwnedFallout3Folder()\n    {\n        if (!OperatingSystem.IsAndroid() || _profiles.ContainsKey("fallout3"))\n            return;\n\n        var pathFile = ProjectSettings.GlobalizePath("user://fallout3-install-path.txt");\n        try\n        {\n            if (!File.Exists(pathFile))\n                return;\n            var defaultRoot = File.ReadAllText(pathFile).Trim();\n            if (string.IsNullOrWhiteSpace(defaultRoot))\n                return;\n            var installation = NativeGameInstallation.Detect(defaultRoot);\n            if (installation.Game != NativeGame.Fallout3)\n                return;\n            _profiles["fallout3"] = new GodotLauncherProfile(\n                "fallout3",\n                installation.InstallRoot,\n                SavePath("fallout3"));\n            _lastCampaignId = "fallout3";\n            Persist();\n            GD.Print($"OPENNV_ANDROID_FO3_PROFILE path={installation.InstallRoot}");\n        }\n        catch (Exception exception) when (\n            exception is DirectoryNotFoundException or InvalidDataException or IOException or UnauthorizedAccessException)\n        {\n            GD.Print($"OPENNV_ANDROID_FO3_PROFILE unavailable file={pathFile} reason={exception.Message}");\n        }\n    }\n\n'''
          if marker not in text:
              raise SystemExit("profile insertion marker not found")
          text = text.replace(marker, method + marker, 1)
          store.write_text(text)
          PY
          grep -Fq 'ImportAndroidOwnedFallout3Folder' runtime/src/Presentation/Ui/GodotLauncherProfileStore.cs

      - name: Install and customize Android Gradle template
        working-directory: runtime-candidate
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path runtime --install-android-build-template
          test -f runtime/android/build.gradle
          test -f runtime/android/build/src/com/godot/game/GodotApp.java
          python3 - <<'PY'
          from pathlib import Path
          import re

          presets = Path("runtime/export_presets.cfg")
          text = presets.read_text()
          text = text.replace('gradle_build/use_gradle_build=false', 'gradle_build/use_gradle_build=true', 1)
          presets.write_text(text)

          activity = Path("runtime/android/build/src/com/godot/game/GodotApp.java")
          activity.write_text(r'''package com.godot.game;

import android.app.Activity;
import android.content.Intent;
import android.net.Uri;
import android.os.Bundle;
import android.os.Handler;
import android.os.Looper;
import android.widget.Toast;

import androidx.documentfile.provider.DocumentFile;

import org.godotengine.godot.GodotActivity;

import java.io.BufferedInputStream;
import java.io.BufferedOutputStream;
import java.io.File;
import java.io.FileInputStream;
import java.io.FileOutputStream;
import java.io.IOException;
import java.io.InputStream;
import java.io.OutputStream;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;

public class GodotApp extends GodotActivity {
    private static final int REQUEST_GAME_TREE = 4703;
    private final ExecutorService copyExecutor = Executors.newSingleThreadExecutor();
    private final Handler mainHandler = new Handler(Looper.getMainLooper());

    @Override
    public void onCreate(Bundle savedInstanceState) {
        setTheme(R.style.GodotAppMainTheme);
        super.onCreate(savedInstanceState);
        if (savedInstanceState == null && !hasImportedFallout3()) {
            mainHandler.postDelayed(this::openGameFolderPicker, 1200);
        }
    }

    private File importMarker() {
        return new File(getFilesDir(), "fallout3-install-path.txt");
    }

    private boolean hasImportedFallout3() {
        File marker = importMarker();
        if (!marker.isFile()) return false;
        String path = readText(marker);
        if (path == null || path.isEmpty()) return false;
        File root = new File(path);
        return new File(root, "Fallout3.exe").isFile() && new File(root, "Data").isDirectory();
    }

    private void openGameFolderPicker() {
        Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
        intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
        startActivityForResult(intent, REQUEST_GAME_TREE);
    }

    @Override
    protected void onActivityResult(int requestCode, int resultCode, Intent data) {
        super.onActivityResult(requestCode, resultCode, data);
        if (requestCode != REQUEST_GAME_TREE || resultCode != Activity.RESULT_OK || data == null || data.getData() == null) {
            return;
        }
        Uri treeUri = data.getData();
        try {
            getContentResolver().takePersistableUriPermission(treeUri, data.getFlags() & Intent.FLAG_GRANT_READ_URI_PERMISSION);
        } catch (SecurityException ignored) {
        }
        Toast.makeText(this, "importing Fallout 3 files…", Toast.LENGTH_LONG).show();
        copyExecutor.execute(() -> {
            try {
                DocumentFile root = DocumentFile.fromTreeUri(this, treeUri);
                if (root == null || !root.isDirectory()) throw new IOException("selected item is not a folder");
                DocumentFile exe = root.findFile("Fallout3.exe");
                DocumentFile dataDir = root.findFile("Data");
                if (exe == null || !exe.isFile() || dataDir == null || !dataDir.isDirectory()) {
                    throw new IOException("Fallout3.exe and Data/ are required at the selected folder root");
                }

                File target = new File(getExternalFilesDir(null), "Fallout3");
                if (target.exists()) deleteRecursively(target);
                if (!target.mkdirs() && !target.isDirectory()) throw new IOException("cannot create import directory");
                copyTree(root, target);
                writeText(importMarker(), target.getAbsolutePath());
                mainHandler.post(() -> {
                    Toast.makeText(this, "Fallout 3 imported. restarting…", Toast.LENGTH_LONG).show();
                    mainHandler.postDelayed(this::recreate, 900);
                });
            } catch (Exception e) {
                mainHandler.post(() -> Toast.makeText(this, "Fallout 3 import failed: " + e.getMessage(), Toast.LENGTH_LONG).show());
            }
        });
    }

    private void copyTree(DocumentFile source, File target) throws IOException {
        for (DocumentFile child : source.listFiles()) {
            String name = child.getName();
            if (name == null || name.contains("/")) continue;
            File out = new File(target, name);
            if (child.isDirectory()) {
                if (!out.mkdirs() && !out.isDirectory()) throw new IOException("cannot create " + out);
                copyTree(child, out);
            } else if (child.isFile()) {
                try (InputStream in = new BufferedInputStream(getContentResolver().openInputStream(child.getUri()));
                     OutputStream os = new BufferedOutputStream(new FileOutputStream(out))) {
                    if (in == null) throw new IOException("cannot open " + child.getUri());
                    byte[] buffer = new byte[1024 * 1024];
                    int count;
                    while ((count = in.read(buffer)) != -1) os.write(buffer, 0, count);
                }
            }
        }
    }

    private static void deleteRecursively(File file) {
        if (file.isDirectory()) {
            File[] children = file.listFiles();
            if (children != null) for (File child : children) deleteRecursively(child);
        }
        file.delete();
    }

    private static String readText(File file) {
        try {
            byte[] data = java.nio.file.Files.readAllBytes(file.toPath());
            return new String(data, java.nio.charset.StandardCharsets.UTF_8).trim();
        } catch (IOException e) {
            return null;
        }
    }

    private static void writeText(File file, String value) throws IOException {
        try (FileOutputStream out = new FileOutputStream(file)) {
            out.write(value.getBytes(java.nio.charset.StandardCharsets.UTF_8));
        }
    }

    @Override
    protected void onDestroy() {
        copyExecutor.shutdownNow();
        super.onDestroy();
    }
}
''')

          manifest = Path("runtime/android/build/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text()
              text = text.replace('android.permission.READ_EXTERNAL_STORAGE', 'android.permission.READ_EXTERNAL_STORAGE', 1)
              manifest.write_text(text)
          PY
          grep -Fq 'gradle_build/use_gradle_build=true' runtime/export_presets.cfg
          grep -Fq 'REQUEST_GAME_TREE' runtime/android/build/src/com/godot/game/GodotApp.java

      - name: Brand runtime for Project Capital
        working-directory: runtime-candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          project = Path("runtime/project.godot")
          text = project.read_text()
          text = text.replace('config/name="OpenNV"', 'config/name="Project Capital"', 1)
          project.write_text(text)

          presets = Path("runtime/export_presets.cfg")
          text = presets.read_text()
          text = text.replace('package/unique_name="io.github.openconstruct.opennevada"', 'package/unique_name="io.github.romanludenberg17.projectcapital"', 1)
          text = text.replace('package/name="OpenNevada Experimental"', 'package/name="Project Capital Experimental"', 1)
          presets.write_text(text)
          PY
          grep -Fq 'config/name="Project Capital"' runtime/project.godot
          grep -Fq 'package/unique_name="io.github.romanludenberg17.projectcapital"' runtime/export_presets.cfg
          grep -Fq 'package/name="Project Capital Experimental"' runtime/export_presets.cfg

      - name: Restore and build Android-targeted C# project
        working-directory: runtime-candidate
        run: |
          set -euo pipefail
          dotnet restore runtime/OpenNV.csproj -p:GodotTargetPlatform=android
          dotnet build runtime/OpenNV.csproj --configuration Release --no-restore -p:GodotTargetPlatform=android

      - name: Export Android ARM64 APK
        working-directory: runtime-candidate
        run: |
          set -euo pipefail
          test -f runtime/project.godot
          test -f runtime/export_presets.cfg
          grep -Fq 'name="Android Handheld Experimental"' runtime/export_presets.cfg
          grep -Fq 'architectures/arm64-v8a=true' runtime/export_presets.cfg
          "$GODOT_BIN" --headless --path runtime --export-debug "Android Handheld Experimental" "$RUNNER_TEMP/Project-Capital-Android-arm64.apk"

      - name: Verify APK package and ABI
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/Project-Capital-Android-arm64.apk"
          test -s "$APK"
          APK_ANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          test -n "$APK_ANALYZER"
          APP_ID="$("$APK_ANALYZER" manifest application-id "$APK")"
          printf 'Application ID: %s\n' "$APP_ID"
          test "$APP_ID" = "io.github.romanludenberg17.projectcapital"
          unzip -Z1 "$APK" | tee "$RUNNER_TEMP/apk-files.txt"
          grep -q '^lib/arm64-v8a/' "$RUNNER_TEMP/apk-files.txt"
          grep -q '^lib/arm64-v8a/libgodot_android.so$' "$RUNNER_TEMP/apk-files.txt"
          unzip -Z1 "$APK" | grep -q 'classes.dex$'

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: project-capital-android-arm64
          path: ${{ runner.temp }}/Project-Capital-Android-arm64.apk
          if-no-files-found: error
          retention-days: 7
